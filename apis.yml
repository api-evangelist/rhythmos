aid: rhythmos
name: Rhythmos
description: >-
  Rhythmos (rhythmos.io) provides modern analytics for managing electric-vehicle
  charging and grid infrastructure. Its platform coordinates fleet charging needs
  against utility and wholesale market conditions to lower energy costs and defer
  costly grid infrastructure investment, serving EV fleet owners, utilities,
  municipalities, and market aggregators through Fleet, Grid, and Market
  applications. Rhythmos maintains a SOC 2 Type II report and is GDPR compliant.
  The company is now part of Electron (electron.net). No public developer API,
  SDK, or developer portal is published at this time; this profile captures the
  company's identity, website properties, and security/compliance posture.
